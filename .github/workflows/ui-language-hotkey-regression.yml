name: Verify recording defaults, languages and shortcuts

on:
  pull_request:
    paths:
      - _internal/live_config.py
      - _internal/unified_gui.py
      - _internal/app_hotkeys.py
      - _internal/hotkey_ui.py
      - _internal/ui_locale.py
      - _internal/core.py
      - _internal/ui_controls.py
      - _internal/studio_ui.py
      - _internal/installer_ui.py
      - _internal/tests/test_ui_locale.py
      - _internal/tests/test_app_hotkeys.py
      - _internal/tests/test_capture_output_defaults.py
      - .github/workflows/ui-language-hotkey-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-regression:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: _internal
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: '3.11'
      - name: Compile all source
        shell: pwsh
        run: |
          python -m compileall -q _internal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Locale and hotkey regression
        shell: pwsh
        run: |
          python -m unittest discover -s _internal/tests -p test_ui_locale.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s _internal/tests -p test_app_hotkeys.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s _internal/tests -p test_capture_output_defaults.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Existing GUI and installer regression
        shell: pwsh
        run: |
          python -m unittest discover -s _internal/tests -p test_installer_ui.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s _internal/tests -p test_v27_gui.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
