name: Render v1.0.3 documentation screenshots

on:
  push:
    branches: [docs/refresh-v103-screens]
    paths:
      - .github/workflows/docs-screenshots-v103.yml
      - _internal/tools/create_guide_screens.py

permissions:
  contents: write

concurrency:
  group: doc-images-v103
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: '3.11'
      - name: Install virtual display and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth python3-tk fonts-noto-cjk
      - name: Install required rendering packages
        run: python -m pip install --only-binary=:all: pillow==11.3.0 tkinterdnd2==0.6.4
      - name: Capture actual Tk widgets with fictional sample data
        run: xvfb-run -a -s '-screen 0 1600x2160x24' python -X utf8 _internal/tools/create_guide_screens.py
      - name: Validate captures
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          folder = Path('_internal/docs/images')
          files = ('main-light.png','main-dark.png','main-compact.png',
                   'menu-light.png','menu-dark.png','menu-compact.png','menu-tools.png',
                   'settings.png','guide-speakers.png','guide-install.png',
                   'guide-maintenance.png','guide-recording.png','guide-gamebar.png',
                   'guide-setup.png','guide-merge.png','guide-updates.png')
          for name in files:
              path = folder/name
              assert path.is_file() and path.stat().st_size > 15000, name
              with Image.open(path) as im:
                  assert im.width >= 500 and im.height >= 300, (name, im.size)
                  assert max(ImageStat.Stat(im.convert('RGB')).stddev) > 12, name
                  print(name, im.size, path.stat().st_size)
          PY
      - name: Commit screenshots to documentation branch
        run: |
          git config user.name Ptcr8
          git config user.email 182083273+Ptcr8@users.noreply.github.com
          git add _internal/docs/images/*.png
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh screenshot assets from v1.0.3 widgets'
            git push origin HEAD:docs/refresh-v103-screens
          fi
