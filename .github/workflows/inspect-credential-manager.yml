name: Inspect Windows credential manager integration
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-smoke:
    # Only run in GitHub-hosted disposable environments, never self-hosted PCs.
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Exercise only an isolated dummy credential
        shell: pwsh
        run: python -I _internal/tools/windows_credential_smoke.py
