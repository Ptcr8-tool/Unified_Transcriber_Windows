name: Inspect pinned tkinterdnd2 wheel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-tkinterdnd2-wheel
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: windows-2025
    timeout-minutes: 100
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      # No repository checkout, pip install, package import or binary execution.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Prepare and verify an unexcluded empty inspection directory
        id: preflight
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $reports = Join-Path $env:RUNNER_TEMP 'unified-dnd-inspection-reports'
          if (Test-Path -LiteralPath $reports) { throw 'Inspection report directory already exists.' }
          [void](New-Item -ItemType Directory -Path $reports -ErrorAction Stop)
          $preflight = [ordered]@{ status='incomplete'; directory_exclusion='unknown'; reason=$null; limitations='No wheel contents or private app data are read or written during this preflight.' }
          $failed = $true
          try {
            $status = Get-CimInstance -Namespace 'root/Microsoft/Windows/Defender' -ClassName 'MSFT_MpComputerStatus' -ErrorAction Stop
            if ($status.AMRunningMode -ne 'Normal' -or -not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) { throw 'Defender is unavailable.' }
            $prefs = Get-CimInstance -Namespace 'root/Microsoft/Windows/Defender' -ClassName 'MSFT_MpPreference' -ErrorAction Stop
            foreach ($property in @('ExclusionExtension','ExclusionProcess','ExclusionPath')) {
              if (-not $prefs.PSObject.Properties[$property]) { throw 'Defender exclusion policy could not be inspected.' }
            }
            $extensions = @($prefs.ExclusionExtension | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })
            $processes = @($prefs.ExclusionProcess | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })
            $preflight['exclusion_policy'] = [ordered]@{ extension_count=$extensions.Count; process_count=$processes.Count }
            if ($processes.Count -gt 0) { throw 'Process exclusions are present and their effect cannot be verified.' }
            foreach ($rule in $extensions) {
              $value = ([string]$rule).Trim()
              if ($value -notmatch '^\.?[A-Za-z0-9_-]+$') { throw 'An extension exclusion has an unrecognized format.' }
              if ($value.TrimStart('.').ToLowerInvariant() -in @('dll','so','dylib','tcl','py','lib','txt')) { throw 'A wheel file extension is excluded.' }
            }
            $platform = Join-Path $env:ProgramData 'Microsoft/Windows Defender/Platform'
            $candidates = @(Get-ChildItem -LiteralPath $platform -Directory -Force | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+(?:-\d+)?$' } | Sort-Object { [version]($_.Name -replace '-\d+$','') } -Descending)
            $scanner = $null
            foreach ($folder in $candidates) {
              $path = Join-Path $folder.FullName 'MpCmdRun.exe'
              if (Test-Path -LiteralPath $path -PathType Leaf) { $scanner = [IO.Path]::GetFullPath($path); break }
            }
            if (-not $scanner) { throw 'Defender scanner is unavailable.' }
            $current = $scanner
            while ($current) {
              $item = Get-Item -LiteralPath $current -Force -ErrorAction Stop
              if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Defender executable path contains a reparse point.' }
              $parent = [IO.Path]::GetDirectoryName($current)
              if ($parent -eq $current) { break }
              $current = $parent
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $scanner -ErrorAction Stop
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(^|,\s*)O=Microsoft Corporation(,|$)') { throw 'Defender executable signature is invalid.' }
            # Fixed, small candidate set on the ephemeral GitHub-hosted runner.
            # A rejected directory is never reused or populated with wheel bytes.
            $roots = @(
              @{ name='documents'; path=[Environment]::GetFolderPath([Environment+SpecialFolder]::MyDocuments) },
              @{ name='public_documents'; path=[Environment]::GetFolderPath([Environment+SpecialFolder]::CommonDocuments) },
              @{ name='program_data'; path=$env:ProgramData },
              @{ name='runner_temp'; path=$env:RUNNER_TEMP }
            )
            $preflight['candidates'] = @()
            $isolated = $null; $documents = $null
            foreach ($candidate in $roots) {
              $attempt = [ordered]@{ name=$candidate.name; status='unknown'; reason=$null; check_exit_code=$null }
              try {
                if ([string]::IsNullOrWhiteSpace($candidate.path) -or -not (Test-Path -LiteralPath $candidate.path -PathType Container)) { throw 'Candidate folder unavailable.' }
                $root = [IO.Path]::GetFullPath($candidate.path)
                if (-not [IO.Path]::IsPathFullyQualified($root) -or $root.StartsWith('\\')) { throw 'Candidate is not a local absolute directory.' }
                $current = $root
                while ($current) {
                  $item = Get-Item -LiteralPath $current -Force -ErrorAction Stop
                  if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Candidate path contains a reparse point.' }
                  $parent = [IO.Path]::GetDirectoryName($current)
                  if ($parent -eq $current) { break }
                  $current = $parent
                }
                $proposed = Join-Path $root ('UnifiedTranscriber-WheelInspection-' + [guid]::NewGuid().ToString('N'))
                if (Test-Path -LiteralPath $proposed) { throw 'Unique candidate directory already exists.' }
                [void](New-Item -ItemType Directory -Path $proposed -ErrorAction Stop)
                $current = $proposed
                while ($current) {
                  $item = Get-Item -LiteralPath $current -Force -ErrorAction Stop
                  if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Created directory path contains a reparse point.' }
                  $parent = [IO.Path]::GetDirectoryName($current)
                  if ($parent -eq $current) { break }
                  $current = $parent
                }
                # Test file creation using only an empty unique file; never execute it.
                $probe = Join-Path $proposed ('.write-probe-' + [guid]::NewGuid().ToString('N'))
                $stream = [IO.File]::Open($probe, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
                $stream.Dispose()
                [IO.File]::Delete($probe)
                $check = [Diagnostics.Process]::new()
                $start = [Diagnostics.ProcessStartInfo]::new()
                $start.FileName = $scanner; $start.UseShellExecute = $false; $start.CreateNoWindow = $true
                $start.RedirectStandardOutput = $true; $start.RedirectStandardError = $true
                foreach ($arg in @('-CheckExclusion','-Path',$proposed)) { $start.ArgumentList.Add($arg) }
                $check.StartInfo = $start
                try {
                  if (-not $check.Start()) { throw 'Could not check candidate exclusion.' }
                  $out = $check.StandardOutput.ReadToEndAsync(); $err = $check.StandardError.ReadToEndAsync()
                  if (-not $check.WaitForExit(20000)) { $check.Kill(); $check.WaitForExit(); throw 'Candidate exclusion check timed out.' }
                  $text = $out.GetAwaiter().GetResult(); $errorText = $err.GetAwaiter().GetResult()
                  $prefix = '(?im)^\s*"?' + [regex]::Escape($proposed) + '"?\s+\[[^\]\r\n]+\]\s+'
                  $notExcluded = $text -match ($prefix + 'is not excluded\.(?:\s+Exit code is 1\.)?\s*$')
                  $isExcluded = $text -match ($prefix + 'is excluded\.(?:\s+Exit code is 0\.)?\s*$')
                  $attempt.check_exit_code = $check.ExitCode
                  if ($check.ExitCode -eq 0 -and $isExcluded -and -not $notExcluded -and [string]::IsNullOrWhiteSpace($errorText)) { $attempt.status='excluded'; throw 'Candidate is excluded by Defender.' }
                  if ($check.ExitCode -ne 1 -or -not $notExcluded -or $isExcluded -or -not [string]::IsNullOrWhiteSpace($errorText)) { throw 'Candidate exclusion result is unrecognized.' }
                  $attempt.status='not_excluded'
                } finally { $check.Dispose() }
                $isolated = $proposed; $documents = $root
                $preflight.directory_exclusion='not_excluded'
              } catch {
                $attempt.reason=$_.Exception.Message
                if ($attempt.status -ne 'excluded') { $attempt.status='unavailable_or_unverified' }
              } finally { $preflight.candidates += $attempt }
              if ($isolated) { break }
            }
            if (-not $isolated) { throw 'No candidate directory passed the writable, path and exclusion checks.' }
            $preflight.status='ready'; $failed=$false
            "isolated_root=$isolated" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "documents_root=$documents" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "scanner_path=$scanner" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } catch { $preflight.reason=$_.Exception.Message }
          finally {
            [IO.File]::WriteAllText((Join-Path $reports 'directory-preflight.json'),(ConvertTo-Json -InputObject $preflight -Depth 10),[Text.UTF8Encoding]::new($false))
            Write-Host (ConvertTo-Json -InputObject $preflight -Depth 10)
          }
          if ($failed) { exit 1 }

      - name: Verify the fixed wheel and isolate all regular files
        env:
          ISOLATED_ROOT: ${{ steps.preflight.outputs.isolated_root }}
          DOCUMENTS_ROOT: ${{ steps.preflight.outputs.documents_root }}
          SCANNER_PATH: ${{ steps.preflight.outputs.scanner_path }}
        run: |
          @'
          import hashlib, io, json, os, re, stat, subprocess, time, urllib.error, urllib.request, zipfile
          from pathlib import Path, PurePosixPath

          WHEEL_URL = ('https://files.pythonhosted.org/packages/73/a6/'
                       '72313c930c923406bd55fd7d389f6fcab2064ccd76be3590ef9d584cf2cf/'
                       'tkinterdnd2-0.6.4-py3-none-any.whl')
          WHEEL_SHA256 = '4b11e0ac6febd8609faf154851d782eca4068bfa68a88ca3d3dded8294367f80'
          UPSTREAM_COMMIT = '52e9879a174dfee147f10126c0ff807e65c43aa5'
          UPSTREAM_PATH = 'tkinterdnd2/tkdnd/win-x64/libtkdnd2.10.3.dll'
          UPSTREAM_GIT_BLOB = '3ce7190f2e8b2577404ebcb6c4e977bc868ce195'
          UPSTREAM_SHA256 = 'd04d033efb45cf683b04ebe23b383bf2ea743891e2a6474a957b41da9b496f30'
          # This exact 12-file inventory was checked against the wheel and upstream tree.
          EXPECTED_NATIVE = {'tkinterdnd2/tkdnd/linux-arm64-tcl9/libtcl9tkdnd2.10.3.so': ('22505982c4b173e969221932613bb2939666cf0a7d56b675860d330ea9caefc9',
                                                                        '523716260a07b1cfcc5fff814263d990eb89b131'),
           'tkinterdnd2/tkdnd/linux-arm64/libtkdnd2.10.3.so': ('64f159eb4071b5cd33fcfb609332478e2e65c819abce803d8be85338959ce31f',
                                                               '1d2d8f6d12e8ebffb9c01a39daf4394b11e6310a'),
           'tkinterdnd2/tkdnd/linux-x64-tcl9/libtcl9tkdnd2.10.3.so': ('6b86d6236b7689cec8354611800ca7f77b93547f275bbd6653034edddcccb35e',
                                                                      'e1fde7409665b16911d69aa7e15e3df5a1a75939'),
           'tkinterdnd2/tkdnd/linux-x64/libtkdnd2.10.3.so': ('b06860716efe360c1f5ea6a9474aedce8c9370c7b380c93fd06c2f7044bae3a3',
                                                             '00b7ffdc7061f514e2861b887a4301c8c0425a39'),
           'tkinterdnd2/tkdnd/osx-arm64-tcl9/libtcl9tkdnd2.10.3.dylib': ('6629cce146235817a19b0bfb2ecad8b12d307f56576d39b7b1f5b753073e20a9',
                                                                         '00775506c5b897c0c5dfa16d4fd38c088850214e'),
           'tkinterdnd2/tkdnd/osx-arm64/libtkdnd2.10.3.dylib': ('474d26c686a97efdf51dbdf1da4e90421f0c4b63d9022741c872e70f5033b735',
                                                                '978c8cac76c64a703395f8d0c7eff53dbc8a702d'),
           'tkinterdnd2/tkdnd/osx-x64/libtkdnd2.9.4.dylib': ('6e4f4fb171fde00d779cd69196b21c7ca12d0e2f9497ef1cc8f76050f2b4f2f6',
                                                             '6755b6e898ee2cda54841d78563519a0a15b18bd'),
           'tkinterdnd2/tkdnd/win-arm64/libtkdnd2.10.3.dll': ('388a3eaba0cda2fec8e2d41387d7d578cd0799bed55ebbc7191ba22346ec3caa',
                                                              'bdf655ee643013831c7852480628b93ad2e4bb19'),
           'tkinterdnd2/tkdnd/win-x64-tcl9/libtkdnd2.10.3.dll': ('22dc45335018f291b98620d9d7fb2c398139306f555ce29a5032d275ca5de38a',
                                                                 'b41b845079437901b243bfeb37ab43702ac8a4a6'),
           'tkinterdnd2/tkdnd/win-x64/libtkdnd2.10.3.dll': ('d04d033efb45cf683b04ebe23b383bf2ea743891e2a6474a957b41da9b496f30',
                                                            '3ce7190f2e8b2577404ebcb6c4e977bc868ce195'),
           'tkinterdnd2/tkdnd/win-x86-tcl9/libtkdnd2.10.3.dll': ('8b6092b4abbd5c6ee5cbb33fe54d26308e11b9220c7414ceaba2d79edb820eb5',
                                                                 'ec10bf0d0f3f8c08b906c1e11bee849e525ad396'),
           'tkinterdnd2/tkdnd/win-x86/libtkdnd2.10.3.dll': ('a67d81a6072b816c97660b0b3954f9b71d2d5c902038fa1bc9f52d05447fec56',
                                                            'e80c2dfddc399dc26e1b6df0e5234661d2f23964')}
          MAX_DOWNLOAD = 6_000_000
          MAX_EXPANDED = 64*1024*1024
          MAX_MEMBER = 16*1024*1024
          MAX_FILES = 2000
          MAX_NATIVE = 32
          DEVICE = re.compile(r'(?:CON|PRN|AUX|NUL|COM[1-9¹²³]|LPT[1-9¹²³])(?:\..*)?\Z',re.I)
          NATIVE = re.compile(r'(?:\.dll|\.pyd|\.dylib|\.bundle|\.exe|\.sys|\.ocx|\.node|\.so(?:\.\d+)*)\Z',re.I)
          temp_root=Path(os.environ['RUNNER_TEMP'])
          assert temp_root.is_absolute() and temp_root.is_dir()
          # Windows directory junctions/reparse points are rejected before writing.
          for parent in (temp_root,*temp_root.parents):
              assert not parent.is_symlink() and not (getattr(parent.lstat(),'st_file_attributes',0) & 0x400), 'Temporary root contains a reparse point'
          reports=temp_root/'unified-dnd-inspection-reports'
          documents=Path(os.environ['DOCUMENTS_ROOT'])
          isolated=Path(os.environ['ISOLATED_ROOT'])
          scanner=Path(os.environ['SCANNER_PATH'])
          assert reports.is_dir() and not reports.is_symlink()
          assert documents.is_absolute() and documents.is_dir() and isolated.is_absolute() and isolated.is_dir()
          assert isolated.parent==documents and re.fullmatch(r'UnifiedTranscriber-WheelInspection-[0-9a-f]{32}',isolated.name)
          assert not any(isolated.iterdir()), 'Inspection directory must be newly created and empty'
          for base in (reports,isolated):
              for parent in (base,*base.parents):
                  assert not parent.is_symlink() and not (getattr(parent.lstat(),'st_file_attributes',0) & 0x400), 'Inspection path contains a reparse point'
          assert scanner.is_absolute() and scanner.is_file(), 'Verified OS scanner is unavailable'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          req=urllib.request.Request(WHEEL_URL,headers={'User-Agent':'UnifiedTranscriber-dnd-inspection/1','Accept-Encoding':'identity'})
          with urllib.request.build_opener(NoRedirect).open(req,timeout=30) as response:
              assert response.geturl()==WHEEL_URL and response.status==200
              assert response.headers.get('Content-Encoding','identity').lower() in ('','identity')
              length=response.headers.get('Content-Length')
              if length is not None: assert 0<int(length)<=MAX_DOWNLOAD
              deadline=time.monotonic()+60; chunks=[]; total=0
              while True:
                  assert time.monotonic()<deadline, 'Wheel download exceeded its deadline'
                  chunk=response.read(min(64*1024,MAX_DOWNLOAD+1-total))
                  if not chunk: break
                  total+=len(chunk)
                  assert total<=MAX_DOWNLOAD, 'Wheel exceeds the allowed download size'
                  chunks.append(chunk)
              raw=b''.join(chunks)
          assert 0<len(raw)<=MAX_DOWNLOAD, 'Wheel exceeds the allowed download size'
          actual=hashlib.sha256(raw).hexdigest()
          assert actual==WHEEL_SHA256, 'Wheel SHA-256 differs from the application trust anchor'
          with zipfile.ZipFile(io.BytesIO(raw)) as wheel:
              entries=wheel.infolist()
              assert 0<len(entries)<=MAX_FILES, 'Unexpected member count'
              assert sum(item.file_size for item in entries)<=MAX_EXPANDED, 'Expanded wheel exceeds size limit'
              folded=set(); native_entries=[]; file_entries=[]
              for entry in entries:
                  original=entry.orig_filename
                  name=entry.filename
                  assert original==name and '\x00' not in original, 'NUL or normalized ZIP member rejected'
                  assert not (entry.flag_bits & 1), 'Encrypted members are not accepted'
                  assert 0<=entry.file_size<=MAX_MEMBER and entry.compress_size>=0
                  assert '\\' not in name, 'Backslash ZIP path rejected'
                  canonical=name[:-1] if entry.is_dir() and name.endswith('/') else name
                  parts=canonical.split('/')
                  assert canonical and not canonical.startswith('/') and PurePosixPath(canonical).as_posix()==canonical
                  assert all(part not in ('','.','..') and len(part)<=200 and part[-1] not in (' ','.')
                             and not DEVICE.fullmatch(part) and not any(ord(ch)<32 or ch in ':<>"|?*' for ch in part)
                             for part in parts), 'Unsafe Windows ZIP path'
                  lowered=canonical.casefold()
                  assert lowered not in folded, 'Case-conflicting ZIP members rejected'
                  folded.add(lowered)
                  mode=(entry.external_attr>>16)&0xffff
                  kind=stat.S_IFMT(mode)
                  assert kind in (0,stat.S_IFREG,stat.S_IFDIR), 'Link or special member rejected'
                  assert kind!=stat.S_IFDIR or entry.is_dir()
                  assert kind!=stat.S_IFREG or not entry.is_dir()
                  if not entry.is_dir():
                      file_entries.append((entry,canonical,parts))
                      if NATIVE.search(canonical):
                          assert len(native_entries)<MAX_NATIVE, 'Too many native binary members'
                          native_entries.append((entry,canonical,parts))
              # Validate every central-directory name before extracting even one file.
              assert len(file_entries)==120, 'Regular-file inventory differs from the verified 120-file set'
              assert {name for _,name,_ in native_entries}==set(EXPECTED_NATIVE), 'Native inventory differs from the verified 12-file set'
              # Make only empty owned placeholders, then check all 120 actual
              # destinations before writing any wheel member bytes.
              checked=[{'path':canonical,'status':'not_checked','exit_code':None} for _,canonical,_ in file_entries]
              try:
                  for index,(entry,canonical,parts) in enumerate(file_entries):
                      state=checked[index]
                      destination=isolated.joinpath(*parts)
                      destination.parent.mkdir(parents=True,exist_ok=True)
                      for parent in (destination.parent,*destination.parent.parents):
                          assert not parent.is_symlink() and not (getattr(parent.lstat(),'st_file_attributes',0) & 0x400), 'Placeholder parent contains a reparse point'
                          if parent==isolated: break
                      with destination.open('xb'): pass
                      state['status']='unknown'
                      try:
                          result=subprocess.run([str(scanner),'-CheckExclusion','-Path',str(destination)],
                              check=False,timeout=20,stdout=subprocess.PIPE,stderr=subprocess.PIPE,
                              text=True,encoding='utf-8',errors='replace',shell=False)
                          state['exit_code']=result.returncode
                          prefix=r'(?im)^\s*"?'+re.escape(str(destination))+r'"?\s+\[[^\]\r\n]+\]\s+'
                          not_excluded=re.search(prefix+r'is not excluded\.(?:\s+Exit code is 1\.)?\s*$',result.stdout)
                          excluded=re.search(prefix+r'is excluded\.(?:\s+Exit code is 0\.)?\s*$',result.stdout)
                          if result.returncode==1 and not_excluded and not excluded and not result.stderr.strip():
                              state['status']='not_excluded'
                          elif result.returncode==0 and excluded and not not_excluded and not result.stderr.strip():
                              state['status']='excluded'
                      except (OSError,subprocess.TimeoutExpired) as exc:
                          state['status']='check_failed'; state['reason']=type(exc).__name__
              finally:
                  (reports/'member-exclusion-preflight.json').write_text(json.dumps({'status':'ready' if len(checked)==120 and all(item['status']=='not_excluded' for item in checked) else 'incomplete','members':checked},indent=2)+'\n',encoding='utf-8')
              assert len(checked)==120 and all(item['status']=='not_excluded' for item in checked), 'At least one member exclusion was detected or could not be checked; no wheel content was written'
              files=[]; natives=[]
              for entry,canonical,parts in file_entries:
                  destination=isolated.joinpath(*parts)
                  for current in (destination,*destination.parents):
                      info=current.lstat()
                      assert not current.is_symlink() and not (getattr(info,'st_file_attributes',0) & 0x400), 'Extraction path contains a reparse point'
                      if current==isolated: break
                  assert destination.is_file() and destination.stat().st_size==0, 'Placeholder changed before extraction'
                  digest=hashlib.sha256(); blob=hashlib.sha1()
                  blob.update(b'blob '+str(entry.file_size).encode('ascii')+b'\0')
                  written=0
                  with wheel.open(entry) as source, destination.open('r+b') as output:
                      opened=os.fstat(output.fileno()); current=destination.lstat()
                      assert not destination.is_symlink() and not (getattr(current,'st_file_attributes',0) & 0x400), 'Placeholder became a reparse point'
                      assert stat.S_ISREG(opened.st_mode) and stat.S_ISREG(current.st_mode) and opened.st_size==0 and (opened.st_dev,opened.st_ino)==(current.st_dev,current.st_ino), 'Placeholder identity changed before extraction'
                      for parent in (destination.parent,*destination.parent.parents):
                          assert not parent.is_symlink() and not (getattr(parent.lstat(),'st_file_attributes',0) & 0x400), 'Extraction parent changed'
                          if parent==isolated: break
                      while True:
                          chunk=source.read(1024*1024)
                          if not chunk: break
                          written+=len(chunk)
                          assert written<=entry.file_size and written<=MAX_MEMBER
                          digest.update(chunk); blob.update(chunk); output.write(chunk)
                  assert written==entry.file_size
                  record={'path':canonical,'bytes':written,'sha256':digest.hexdigest(),
                          'kind':'native' if canonical in EXPECTED_NATIVE else 'other'}
                  if canonical in EXPECTED_NATIVE:
                      upstream_sha,upstream_blob=EXPECTED_NATIVE[canonical]
                      record.update(git_blob_sha1=blob.hexdigest(),upstream_sha256=upstream_sha,
                                    upstream_git_blob=upstream_blob,
                                    matches_upstream=digest.hexdigest()==upstream_sha and blob.hexdigest()==upstream_blob)
                      natives.append(record)
                  files.append(record)
          assert natives, 'No native binaries were found; inspection is incomplete'
          matches=[item for item in natives if item['sha256']==UPSTREAM_SHA256]
          path_matches=[item for item in natives if item['path']==UPSTREAM_PATH]
          report={'wheel_name':'tkinterdnd2-0.6.4-py3-none-any.whl','wheel_bytes':len(raw),
                  'wheel_sha256':actual,'expected_wheel_sha256':WHEEL_SHA256,
                  'upstream_commit':UPSTREAM_COMMIT,'upstream_path':UPSTREAM_PATH,
                  'upstream_git_blob':UPSTREAM_GIT_BLOB,'upstream_sha256':UPSTREAM_SHA256,
                  'upstream_sha256_matches':[item['path'] for item in matches],
                  'upstream_path_sha256_matches':len(path_matches)==1 and path_matches[0]['sha256']==UPSTREAM_SHA256,
                  'upstream_path_blob_matches':len(path_matches)==1 and path_matches[0]['git_blob_sha1']==UPSTREAM_GIT_BLOB,
                  'members_checked':len(entries),'files_checked':len(files),'files':files,'native':natives,
                  'all_native_match_upstream':all(item['matches_upstream'] for item in natives),
                  'limitations':'Static hashes and Defender are not a safety verdict; no wheel component was imported or executed. Defender may send public package samples or metadata to Microsoft under its existing cloud settings; no private app data is scanned.'}
          (reports/'wheel-inventory.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          '@ | python -I -X utf8 -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Scan each isolated regular file with Microsoft Defender
        env:
          ISOLATED_ROOT: ${{ steps.preflight.outputs.isolated_root }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $reports = Join-Path $env:RUNNER_TEMP 'unified-dnd-inspection-reports'
          $isolated = [IO.Path]::GetFullPath($env:ISOLATED_ROOT)
          $inventory = Get-Content -Raw -Encoding utf8 -LiteralPath (Join-Path $reports 'wheel-inventory.json') | ConvertFrom-Json
          $summary = [ordered]@{
            scanner = 'Microsoft Defender Antivirus individual custom scans'
            status = 'not_completed'; clean = $false; results = @()
            signatures = $null; started_at = [DateTime]::UtcNow.ToString('o'); completed_at = $null
            limitations = 'Static scanner output is not proof of safety. No wheel component was imported or executed. Defender may send public package samples or metadata to Microsoft under its existing cloud settings; no private app data is scanned.'
          }
          $hasErrors = $false
          try {
            if (@($inventory.files).Count -ne 120 -or @($inventory.native).Count -ne 12) { throw 'Inspection inventory counts do not match the verified wheel.' }
            $status = Get-CimInstance -Namespace 'root/Microsoft/Windows/Defender' -ClassName 'MSFT_MpComputerStatus' -ErrorAction Stop
            if ($status.AMRunningMode -ne 'Normal' -or -not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) { throw 'Defender is unavailable; no clean result can be reported.' }
            $updated = $status.AntivirusSignatureLastUpdated.ToUniversalTime()
            if ([string]::IsNullOrWhiteSpace([string]$status.AntivirusSignatureVersion) -or $updated -lt [DateTime]::UtcNow.AddHours(-72) -or $updated -gt [DateTime]::UtcNow.AddHours(24)) { throw 'Defender security intelligence is stale or invalid; no clean result can be reported.' }
            $summary.signatures = [ordered]@{ engine = [string]$status.AMEngineVersion; version = [string]$status.AntivirusSignatureVersion; updated_at = $updated.ToString('o') }
            # Read policy only; do not change or print any potentially sensitive entries.
            $prefs = Get-CimInstance -Namespace 'root/Microsoft/Windows/Defender' -ClassName 'MSFT_MpPreference' -ErrorAction Stop
            foreach ($property in @('ExclusionExtension','ExclusionProcess','ExclusionPath')) {
              if (-not $prefs.PSObject.Properties[$property]) { throw 'Defender exclusion policy could not be inspected.' }
            }
            $extensionRules = @($prefs.ExclusionExtension | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })
            $processRules = @($prefs.ExclusionProcess | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })
            $pathRules = @($prefs.ExclusionPath | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })
            $summary['exclusion_policy'] = [ordered]@{ extension_count=$extensionRules.Count; process_count=$processRules.Count; path_count=$pathRules.Count; process_rules_unverified=($processRules.Count -gt 0) }
            $platform = Join-Path $env:ProgramData 'Microsoft/Windows Defender/Platform'
            $candidates = @(Get-ChildItem -LiteralPath $platform -Directory -Force | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+(?:-\d+)?$' } | Sort-Object { [version]($_.Name -replace '-\d+$','') } -Descending)
            $scanner = $null
            foreach ($item in $candidates) {
              $path = Join-Path $item.FullName 'MpCmdRun.exe'
              if (Test-Path -LiteralPath $path -PathType Leaf) { $scanner = $path; break }
            }
            if (-not $scanner) { throw 'Defender scanner was not found in its OS-owned platform directory.' }
            $current = [IO.Path]::GetFullPath($scanner)
            while ($current) {
              $object = Get-Item -LiteralPath $current -Force -ErrorAction Stop
              if (($object.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'The OS Defender path contains a link or reparse point.' }
              $parent = [IO.Path]::GetDirectoryName($current)
              if ($parent -eq $current) { break }
              $current = $parent
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $scanner -ErrorAction Stop
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(^|,\s*)O=Microsoft Corporation(,|$)') { throw 'The Defender executable does not have a valid Microsoft signature.' }
            foreach ($item in $inventory.files) {
              try {
              $path = [IO.Path]::GetFullPath((Join-Path $isolated ([string]$item.path)))
              if (-not $path.StartsWith($isolated + [IO.Path]::DirectorySeparatorChar,[StringComparison]::OrdinalIgnoreCase)) { throw 'A file path escaped the isolated directory.' }
              $current = $path
              while ($current) {
                $object = Get-Item -LiteralPath $current -Force -ErrorAction Stop
                if (($object.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'A file path contains a link or reparse point.' }
                $parent = [IO.Path]::GetDirectoryName($current)
                if ($parent -eq $current) { break }
                $current = $parent
              }
              $digest = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($digest -cne $item.sha256) { throw 'A file changed after extraction.' }
              $exclusion = [ordered]@{ status='unknown'; exit_code=$null; stdout=''; stderr=''; reason=$null }
              $check = [Diagnostics.Process]::new()
              $checkStart = [Diagnostics.ProcessStartInfo]::new()
              $checkStart.FileName = $scanner; $checkStart.UseShellExecute = $false; $checkStart.CreateNoWindow = $true
              $checkStart.RedirectStandardOutput = $true; $checkStart.RedirectStandardError = $true
              foreach ($arg in @('-CheckExclusion','-Path',$path)) { $checkStart.ArgumentList.Add($arg) }
              $check.StartInfo = $checkStart
              try {
                if (-not $check.Start()) { throw 'Could not start the exclusion check.' }
                $checkOut = $check.StandardOutput.ReadToEndAsync(); $checkErr = $check.StandardError.ReadToEndAsync()
                if (-not $check.WaitForExit(20000)) { $check.Kill(); $check.WaitForExit(); throw 'Exclusion check timed out after 20 seconds.' }
                $exclusion.exit_code = $check.ExitCode
                $exclusion.stdout = $checkOut.GetAwaiter().GetResult(); $exclusion.stderr = $checkErr.GetAwaiter().GetResult()
                $prefix = '(?im)^\s*"?' + [regex]::Escape($path) + '"?\s+\[[^\]\r\n]+\]\s+'
                $notExcluded = $exclusion.stdout -match ($prefix + 'is not excluded\.(?:\s+Exit code is 1\.)?\s*$')
                $isExcluded = $exclusion.stdout -match ($prefix + 'is excluded\.(?:\s+Exit code is 0\.)?\s*$')
                if ($check.ExitCode -eq 1 -and $notExcluded -and -not $isExcluded -and [string]::IsNullOrWhiteSpace($exclusion.stderr)) { $exclusion.status = 'not_excluded' }
                elseif ($check.ExitCode -eq 0 -and $isExcluded -and -not $notExcluded -and [string]::IsNullOrWhiteSpace($exclusion.stderr)) { $exclusion.status = 'excluded' }
                else { $exclusion.reason = 'Exclusion result is unavailable or unrecognized.' }
              } catch {
                $exclusion.status = 'check_failed'; $exclusion.reason = $_.Exception.Message
              } finally { $check.Dispose() }
              # Extension checks are conservative; contextual/unknown formats remain unverified.
              $extension = [IO.Path]::GetExtension($path).TrimStart('.')
              $extensionStatus = 'not_excluded'
              foreach ($rule in $extensionRules) {
                $value = ([string]$rule).Trim()
                if ($value -notmatch '^\.?[A-Za-z0-9_-]+$') { $extensionStatus = 'unknown'; break }
                if ($value.TrimStart('.') -ieq $extension) { $extensionStatus = 'excluded'; break }
              }
              $exclusion['extension_status'] = $extensionStatus
              if ($exclusion.status -ne 'not_excluded' -or $extensionStatus -ne 'not_excluded') {
                $summary.results += [pscustomobject]@{ path=[string]$item.path; sha256_before=$digest; exclusion=$exclusion; outcome='not_scanned_excluded_or_unverified' }
                $hasErrors = $true
                continue
              }
              $process = [Diagnostics.Process]::new()
              $start = [Diagnostics.ProcessStartInfo]::new()
              $start.FileName = $scanner; $start.UseShellExecute = $false; $start.CreateNoWindow = $true
              $start.RedirectStandardOutput = $true; $start.RedirectStandardError = $true
              # This flag affects this custom scan only; it does not change Defender policy.
              foreach ($arg in @('-Scan','-ScanType','3','-File',$path,'-DisableRemediation')) { $start.ArgumentList.Add($arg) }
              $process.StartInfo = $start
              try {
                if (-not $process.Start()) { throw 'Could not start the individual Defender scan.' }
                $stdout = $process.StandardOutput.ReadToEndAsync(); $stderr = $process.StandardError.ReadToEndAsync()
                if (-not $process.WaitForExit(20000)) { $process.Kill(); $process.WaitForExit(); throw 'Individual Defender scan timed out after 20 seconds.' }
                $output = $stdout.GetAwaiter().GetResult(); $errorText = $stderr.GetAwaiter().GetResult()
                $after = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
                $combined = $output + "`n" + $errorText
                $threat = ($combined -match '(?im)^\s*(?:Threat(?:\s+Name)?|Name)\s*[:=]\s*\S') -or ($combined -match '(?i)\bfound\s+[1-9]\d*\s+threats?\b')
                $pattern = '(?im)^\s*Scanning\s+"?' + [regex]::Escape($path) + '"?\s+found\s+no\s+threats\.\s*$'
                $explicitNoThreat = $output -match $pattern
                $ok = ($process.ExitCode -eq 0 -and $explicitNoThreat -and -not $threat -and [string]::IsNullOrWhiteSpace($errorText) -and $after -ceq $digest -and $processRules.Count -eq 0)
                $outcome = if ($ok) { 'explicit_no_threats' } elseif ($threat) { 'detection_reported' } elseif ($processRules.Count -gt 0) { 'process_exclusion_policy_unverified' } else { 'scan_error_or_unrecognized_output' }
                $summary.results += [pscustomobject]@{ path = [string]$item.path; sha256_before = $digest; sha256_after = $after; exclusion = $exclusion; exit_code = $process.ExitCode; named_threat = $threat; explicit_no_threats = $explicitNoThreat; outcome = $outcome; stdout = $output; stderr = $errorText }
                if (-not $ok) { $hasErrors = $true }
              } catch {
                $hasErrors = $true
                $summary.results += [pscustomobject]@{ path=[string]$item.path; sha256_before=$digest; exclusion=$exclusion; outcome='scan_error_or_timeout'; reason=$_.Exception.Message }
              } finally { $process.Dispose() }
              } catch {
                $hasErrors = $true
                $summary.results += [pscustomobject]@{ path=[string]$item.path; sha256_before=[string]$item.sha256; exclusion=[ordered]@{status='unknown'}; outcome='not_scanned_file_error'; reason=$_.Exception.Message }
              }
            }
            if (@($summary.results).Count -ne @($inventory.files).Count) { throw 'Individual result count does not match the verified file inventory.' }
            $summary.status = if ($hasErrors) { 'detected_error_or_incomplete' } else { 'scan_completed_without_detection' }
            $summary.clean = -not $hasErrors
          } catch {
            $hasErrors = $true
            $summary.status = 'unavailable_or_incomplete'
            $summary['error'] = $_.Exception.Message
          } finally {
            # Preserve an explicit per-file unverified record if a platform or
            # scan failure stopped inspection before the remaining entries.
            $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            foreach ($result in $summary.results) { [void]$seen.Add([string]$result.path) }
            foreach ($item in $inventory.files) {
              if ($seen.Add([string]$item.path)) {
                $summary.results += [pscustomobject]@{ path=[string]$item.path; sha256_before=[string]$item.sha256; exclusion=[ordered]@{status='unknown'}; outcome='not_scanned_inspection_incomplete' }
                $summary.status = 'unavailable_or_incomplete'; $summary.clean = $false; $hasErrors = $true
              }
            }
            $summary.completed_at = [DateTime]::UtcNow.ToString('o')
            [IO.File]::WriteAllText((Join-Path $reports 'defender-individual-scans.json'),(ConvertTo-Json -InputObject $summary -Depth 10),[Text.UTF8Encoding]::new($false))
            Write-Host (ConvertTo-Json -InputObject $summary -Depth 10)
          }
          if ($hasErrors) { exit 1 }

      - name: Save inspection reports only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tkinterdnd2-0.6.4-inspection-reports
          path: ${{ runner.temp }}/unified-dnd-inspection-reports/*.json
          if-no-files-found: warn
          retention-days: 14
