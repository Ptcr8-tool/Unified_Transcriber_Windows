name: Dispatch approved v1.0.4 release
on:
  push:
    branches: ['ops/publish-v1.0.4-20261112']
    paths: ['.github/workflows/publish-approved-v104.yml']
permissions:
  contents: read
jobs:
  dispatch:
    if: github.repository == 'Ptcr8-tool/Unified_Transcriber_Windows' && github.ref == 'refs/heads/ops/publish-v1.0.4-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Bind new tag to reviewed main and invoke the normal attested release pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import base64, json, os, urllib.error, urllib.request
          repo='Ptcr8-tool/Unified_Transcriber_Windows'
          expected='fc698c3349b21ddbd42db4d5968419b9b87dcbec'
          tag='v1.0.4'
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF']=='refs/heads/ops/publish-v1.0.4-20261112'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          def api(path,body=None,missing=False):
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                       'Accept':'application/vnd.github+json',
                       'User-Agent':'UnifiedTranscriber-approved-release',
                       'X-GitHub-Api-Version':'2022-11-28'}
              payload=None if body is None else json.dumps(body).encode('utf-8')
              if payload is not None:headers['Content-Type']='application/json'
              request=urllib.request.Request('https://api.github.com/repos/'+repo+path,
                  data=payload,headers=headers,method='GET' if body is None else 'POST')
              try:
                  with opener.open(request,timeout=30) as response:
                      data=response.read(2*1024*1024+1)
                  assert len(data)<=2*1024*1024
                  return json.loads(data) if data else None
              except urllib.error.HTTPError as exc:
                  if exc.code==404 and missing:return None
                  raise RuntimeError('GitHub request failed: HTTP '+str(exc.code)+' for '+path) from None
          pr=api('/pulls/24')
          assert pr['merged'] is True and pr['merge_commit_sha']==expected
          assert api('/git/ref/heads/main')['object']['sha']==expected, 'main moved; review before release'
          version=api('/contents/VERSION?ref='+expected)
          assert base64.b64decode(version['content']).decode('utf-8').strip()=='1.0.4'
          assert api('/releases/tags/'+tag,missing=True) is None, 'Do not overwrite an existing release'
          workflow=api('/actions/workflows/windows-release.yml')
          assert workflow['state']=='active'
          ref=api('/git/ref/tags/'+tag,missing=True)
          if ref is None:
              ref=api('/git/refs',{'ref':'refs/tags/'+tag,'sha':expected})
          assert ref['object']['type']=='commit' and ref['object']['sha']==expected, 'Never move existing tags'
          # Token-created tags do not recursively start push workflows. An
          # explicit dispatch runs the existing workflow under the tagged ref,
          # preserving its provenance identity and all release safety gates.
          api('/actions/workflows/windows-release.yml/dispatches',
              {'ref':tag,'inputs':{'publish_release':True}})
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('Dispatched windows-release.yml at '+tag+' / '+expected+' with publish_release=true.\n')
              out.write('No existing release, tag, main branch protection or security checks were replaced.\n')
          print('Approved tagged release pipeline dispatched for',tag,expected)
          PY
