name: Refresh README screenshots from current Tk widgets
# Re-run after using Windows sample paths in setup screenshots.

on:
  push:
    branches:
      - docs/refresh-readme-v103
    paths:
      - .github/workflows/refresh-readme-screenshots.yml
      - _internal/tools/create_guide_screens.py

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true
      - name: Install real Tk screenshot dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb python3-tk python3-venv fonts-noto-cjk
          python3 -m venv "$RUNNER_TEMP/screens-venv"
          "$RUNNER_TEMP/screens-venv/bin/python" -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Capture the application with synthetic demonstration data
        shell: bash
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1920x1700x24' "$RUNNER_TEMP/screens-venv/bin/python" _internal/tools/create_guide_screens.py
      - name: Confirm screenshots were generated and contain valid PNGs
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/screens-venv/bin/python" - <<'PY'
          from PIL import Image
          from pathlib import Path
          folder=Path('_internal/docs/images')
          for name in ('main-light.png','main-dark.png','main-compact.png','settings.png','guide-recording.png','guide-setup.png','guide-speakers.png'):
              file=folder/name
              with Image.open(file) as im:
                  im.verify()
              print(name, file.stat().st_size)
          PY
      - name: Commit refreshed image assets on documentation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ptcr8'
          git config user.email '182083273+Ptcr8@users.noreply.github.com'
          git add -A -- _internal/docs/images
          if git diff --cached --quiet; then
              echo 'Screenshots are already current'
              exit 0
          fi
          git commit -m 'Refresh v1.0.3 UI screenshots from actual Tk controls'
          git push origin HEAD:docs/refresh-readme-v103
