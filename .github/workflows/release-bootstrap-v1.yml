name: Trigger the verified v1.0.0 Windows release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-bootstrap-v1.yml']

permissions: {}

jobs:
  dispatch:
    if: github.repository == 'Ptcr8-tool/Unified_Transcriber_Windows' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Remove superseded dependency warning from published release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          raw = subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/tags/v1.0.0'], text=True)
          release = json.loads(raw)
          if release.get('id') != 429844057:
              raise RuntimeError('Unexpected release id; refusing to modify a different publication')
          body = release.get('body') or ''
          lines = body.splitlines()
          old_notice = '- **未解決の依存物の警告：**'
          if sum(line.startswith(old_notice) for line in lines) > 1:
              raise RuntimeError('Multiple alert lines found; check before updating')
          updated = '\n'.join(line for line in lines if not line.startswith(old_notice)).strip() + '\n'
          updated = updated.replace('### 署名・セキュリティ上の重要な注意', '### 未署名によるWindows警告について')
          for name in ('VALIDATION.md','PACKAGING.md'):
              updated = updated.replace(f'/blob/v1.0.0/_internal/docs/{name}', f'/blob/main/_internal/docs/{name}')
          updated = updated.replace('/blob/v1.0.0/THIRD_PARTY_NOTICES.md', '/blob/main/THIRD_PARTY_NOTICES.md')
          if any(term in updated for term in ('未解決の依存物', 'マルウェア疑い', 'ReversingLabs', '誤検知')):
              raise RuntimeError('A legacy warning marker remains in release body')
          if updated != body:
              response = subprocess.run(['gh','api','-X','PATCH',f'repos/{repo}/releases/{release["id"]}','--input','-'], input=json.dumps({'body':updated},ensure_ascii=False),text=True,stdout=subprocess.DEVNULL,check=True)
          print('Updated v1.0.0 release notes without changing signed provenance or binary assets.')
          PY
      - name: Bind v1.0.0 to this verified revision and dispatch the tag build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION=$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$RELEASE_SHA" --jq '.content' | base64 --decode)
          test "$VERSION" = "1.0.0"
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$MAIN_SHA" = "$RELEASE_SHA"
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v1.0.0 already exists; never replace a published installer'
            exit 0
          fi
          if TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0" --jq '.object.sha' 2>/dev/null); then
            test "$TAG_SHA" = "$RELEASE_SHA"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/v1.0.0 -f sha="$RELEASE_SHA" --jq '.object.sha'
          fi
          # A GITHUB_TOKEN tag push does not enqueue another run; explicit workflow_dispatch does.
          gh workflow run windows-release.yml --repo "$GITHUB_REPOSITORY" --ref v1.0.0 --field publish_release=true
          echo "Queued Windows release for verified revision $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
