name: Publish approved v1.0.2

on:
  push:
    branches: ['release/publish-v1.0.2']
    paths: ['.github/workflows/request-v1.0.2-release.yml']

permissions:
  contents: read

concurrency:
  group: publish-approved-v1.0.2
  cancel-in-progress: false

jobs:
  request:
    if: github.repository == 'Ptcr8-tool/Unified_Transcriber_Windows'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      RELEASE_COMMIT: f39f2d35ea6564af24962d267dad09d0317fce94
      RELEASE_TAG: v1.0.2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false

      - name: Tag the approved source and request the gated Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release/publish-v1.0.2
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(cat VERSION)" = 1.0.2
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_COMMIT"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo 'This release already exists.' >&2
            exit 1
          fi
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha 2>/dev/null); then
            test "$existing" = "$RELEASE_COMMIT"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT" >/dev/null
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$RELEASE_COMMIT"
          gh workflow run windows-release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" --field publish_release=true
          printf 'Requested the Windows release for %s at `%s`.\n' "$RELEASE_TAG" "$RELEASE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
