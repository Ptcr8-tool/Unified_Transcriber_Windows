name: Verify Hugging Face setup and build v1.0.2-a installer

on:
  push:
    branches: ['build/huggingface-setup-v1.0.2-a']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: requested-installer-v1.0.2-a
  cancel-in-progress: true

jobs:
  windows:
    if: github.repository == 'Ptcr8-tool/Unified_Transcriber_Windows' && github.ref == 'refs/heads/build/huggingface-setup-v1.0.2-a'
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve deterministic source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
          check-latest: true

      - name: Exercise Windows menu activation and keyboard navigation
        env:
          PYTHONPATH: '_internal;_internal/tests'
        run: |
          foreach ($attempt in 1..3) {
            python -m unittest -q test_navigation_panel test_v29_navigation test_guide_top
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Validate source and record exact build manifest
        run: |
          @'
          import ast, hashlib, json, os, subprocess
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          assert version == '1.0.2-a'
          assert f"APP_VERSION = '{version}'" in Path('_internal/core.py').read_text()
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['SOURCE_COMMIT']
          for path in Path('_internal').rglob('*.py'):
              ast.parse(path.read_text(encoding='utf-8-sig'), filename=str(path), feature_version=(3,11))
          names = subprocess.check_output(['git','ls-files','-z']).decode('utf-8').split('\0')
          files = {name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in sorted(names) if name}
          digest = hashlib.sha256(json.dumps(files,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path('dist').mkdir(exist_ok=True)
          Path('dist/SOURCE_MANIFEST.json').write_text(json.dumps({'source_commit':os.environ['SOURCE_COMMIT'],'sha256':digest,'files':files},indent=2)+'\n',encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build pinned CPython runtime and verify native dependencies
        run: python _internal/tools/build_windows.py snapshot-runtime --work "$env:RUNNER_TEMP\unified-build"

      - name: Create isolated build and test environment
        run: |
          & "$env:RUNNER_TEMP\unified-build\Runtime\python.exe" -m venv "$env:RUNNER_TEMP\unified-build-env"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\unified-build-env\Scripts\python.exe" -m pip --isolated install --require-hashes --only-binary=:all: --no-input -r _internal/tools/requirements-build.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\unified-build-env\Scripts\python.exe" -m pip --isolated check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete Windows regression test suite
        env:
          PYTHONPATH: _internal
        run: |
          & "$env:RUNNER_TEMP\unified-build-env\Scripts\python.exe" -m pip --isolated install --no-input --require-hashes --only-binary=:all: -r _internal/tools/requirements-tests-windows.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\unified-build-env\Scripts\python.exe" -m unittest discover -s _internal/tests -v 2>&1 | Tee-Object -FilePath dist/WINDOWS_TESTS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build v1.0.2-a setup executable
        run: |
          & "$env:RUNNER_TEMP\unified-build-env\Scripts\python.exe" _internal/tools/build_windows.py build --work "$env:RUNNER_TEMP\unified-build" --output dist --repository-id "$env:GITHUB_REPOSITORY_ID" --source-commit "$env:SOURCE_COMMIT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify actual executable version resources
        run: |
          $targets = @('dist/Unified_Transcriber_Setup_v1.0.2-a.exe', "$env:RUNNER_TEMP\unified-build\payload\UnifiedTranscriber.exe")
          $checks = foreach ($target in $targets) {
            $info = (Get-Item -LiteralPath $target).VersionInfo
            if ($info.FileVersion -cne '1.0.2-a' -or $info.ProductVersion -cne '1.0.2-a') { throw "Incorrect display version in $target" }
            if ($info.FileMajorPart -ne 1 -or $info.FileMinorPart -ne 0 -or $info.FileBuildPart -ne 2 -or $info.FilePrivatePart -ne 1) { throw "Incorrect numeric version in $target" }
            [ordered]@{file = (Split-Path -Leaf $target); file_version = $info.FileVersion; product_version = $info.ProductVersion; numeric_version = '1.0.2.1'}
          }
          [ordered]@{version='1.0.2-a'; source_commit=$env:SOURCE_COMMIT; checked=$true; files=@($checks)} | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 dist/VERSION_CHECK.json

      - name: Verify actual legacy profile setup and Hugging Face downloads
        run: |
          & "$env:RUNNER_TEMP\unified-build-env\Scripts\python.exe" _internal/tools/huggingface_smoke.py --work "$env:RUNNER_TEMP\unified-build" --dist dist 2>&1 | Tee-Object -FilePath dist/HUGGINGFACE_TESTS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installation, launch, repair, migration and uninstall
        run: |
          & "$env:RUNNER_TEMP\unified-build-env\Scripts\python.exe" _internal/tools/windows_smoke.py --work "$env:RUNNER_TEMP\unified-build" --dist dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Scan the final setup and complete payload with Microsoft Defender
        run: |
          & _internal/tools/defender_scan.ps1 -ScanPath @('dist\Unified_Transcriber_Setup_v1.0.2-a.exe', "$env:RUNNER_TEMP\unified-build\payload") -ReportPath dist/DEFENDER_SCAN.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify tested setup digest and unchanged scan targets
        run: |
          $setupPath = (Resolve-Path -LiteralPath 'dist/Unified_Transcriber_Setup_v1.0.2-a.exe').Path
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $setupPath).Hash.ToLowerInvariant()
          $scan = Get-Content -Raw -Encoding utf8 -LiteralPath 'dist/DEFENDER_SCAN.json' | ConvertFrom-Json
          if ($scan.status -ne 'clean' -or $scan.clean -ne $true -or $scan.artifacts_unchanged -ne $true) { throw 'A clean unchanged Defender scan is required' }
          foreach ($property in @('artifact_inventory_before', 'artifact_inventory_after')) {
            $matches = @($scan.$property | Where-Object { $_.path -eq $setupPath })
            if ($matches.Count -ne 1 -or $matches[0].sha256 -cne $digest) { throw 'Setup digest differs from the Defender scan' }
          }
          "Tested installer SHA256: $digest" >> $env:GITHUB_STEP_SUMMARY

      - name: Store verified installer and reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Unified-Transcriber-Windows-1.0.2-a
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.json
            dist/SOURCE_MANIFEST.json
            dist/DEPENDENCIES.json
            dist/WINDOWS_SMOKE.json
            dist/DEFENDER_SCAN.json
            dist/VERSION_CHECK.json
            dist/WINDOWS_TESTS.txt
            dist/HUGGINGFACE_SMOKE.json
            dist/HUGGINGFACE_TESTS.txt
          if-no-files-found: error
          retention-days: 14
