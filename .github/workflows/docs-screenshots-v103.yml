name: Refresh v1.0.3 screenshots
on:
  push:
    branches:
      - docs/refresh-v103-screens

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Setup virtual desktop and Japanese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth python3-tk fonts-noto-cjk
      - name: Install screenshot tools
        run: python -m pip install pillow==11.3.0 tkinterdnd2==0.6.4
      - name: Install and verify the pinned drag-and-drop wheel
        run: xvfb-run -a -s '-screen 0 1600x2160x24' python _internal/dnd_support.py --install-and-check
      - name: Generate screenshots
        run: xvfb-run -a -s '-screen 0 1600x2160x24' python _internal/tools/create_guide_screens.py
      - name: Verify PNG output and commit
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('_internal/docs/images/main-light.png'); assert p.is_file() and p.stat().st_size > 30000"
          python -c "from pathlib import Path; p=Path('_internal/docs/images/menu-light.png'); assert p.is_file() and p.stat().st_size > 30000"
          python -c "from pathlib import Path; p=Path('_internal/docs/images/guide-speakers.png'); assert p.is_file() and p.stat().st_size > 30000"
          git config user.name Ptcr8
          git config user.email 182083273+Ptcr8@users.noreply.github.com
          git add _internal/docs/images/*.png
          git reset -q -- _internal/docs/images/guide-install.png _internal/docs/images/guide-maintenance.png
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh v1.0.3 real Tk screenshots'
            git push origin HEAD:docs/refresh-v103-screens
          fi
