name: Verify stop-shortcut notifications

on:
  pull_request:
    paths:
      - '_internal/shortcut_feedback.py'
      - '_internal/windows_background.py'
      - '_internal/unified_gui.py'
      - '_internal/tests/test_shortcut_feedback.py'
      - '.github/workflows/shortcut-feedback-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shortcut-notification-windows:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: '_internal;_internal/tests'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Compile and check whitespace
        shell: pwsh
        run: |
          python -m compileall -q _internal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Notification, tray, top stop, capture and locale regressions
        shell: pwsh
        run: |
          python -m unittest -v test_shortcut_feedback test_background test_top_stop test_v27_gui test_recorded_queue test_ui_locale test_app_hotkeys
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
