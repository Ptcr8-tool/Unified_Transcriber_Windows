name: One-time v1.0.3 release kickoff
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1.0.3.yml']
permissions: {}

jobs:
  kickoff:
    if: github.repository == 'Ptcr8-tool/Unified_Transcriber_Windows' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Tag exact reviewed commit and dispatch Windows release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          sha="$GITHUB_SHA"
          current=$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')
          echo "Event SHA: $sha; current main SHA: $current"
          if [ "$sha" != "$current" ]; then echo "Main advanced after this workflow began" >&2; exit 1; fi
          raw=$(gh api "repos/$repo/contents/VERSION?ref=$sha" --jq '.content')
          echo "VERSION base64 length: ${#raw}"
          version=$(printf '%s' "$raw" | base64 -d)
          printf 'VERSION decoded: <%q>\n' "$version"
          if [ "$version" != '1.0.3' ]; then echo "Tag version did not match the source" >&2; exit 1; fi
          if gh release view v1.0.3 --repo "$repo" >/dev/null 2>&1; then
            echo 'Already released; will not overwrite a published installer.'
            exit 0
          fi
          existing=$(gh api "repos/$repo/git/matching-refs/tags/v1.0.3" --jq '.[] | select(.ref == "refs/tags/v1.0.3") | .object.sha')
          printf 'Matching exact tag SHA: <%q>\n' "$existing"
          if [ -n "$existing" ]; then
            if [ "$existing" != "$sha" ]; then echo "Tag already points to a different commit" >&2; exit 1; fi
          else
            echo "Creating tag v1.0.3 at reviewed commit"
            gh api -X POST "repos/$repo/git/refs" -f ref=refs/tags/v1.0.3 -f sha="$sha" --jq '.object.sha'
          fi
          echo "Dispatching tested Windows release"
          gh workflow run windows-release.yml --repo "$repo" --ref v1.0.3 --field publish_release=true
          echo "Dispatched v1.0.3 from $sha" >> "$GITHUB_STEP_SUMMARY"
