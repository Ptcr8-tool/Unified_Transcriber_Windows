name: Refresh README documentation screenshots

on:
  push:
    branches:
      - docs/refresh-readme-screens-20261109
    paths:
      - .github/workflows/refresh-readme-screens.yml

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - name: Install virtual desktop, Japanese fonts and Tk image libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth python3-tk python3-pil python3-pil.imagetk fonts-noto-cjk
          /usr/bin/python3 -c 'import tkinter; import PIL.ImageGrab; print("Tk and Pillow OK")'
      - name: Re-render current real Tk widgets with synthetic sample records
        shell: bash
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 2200x2100x24 -ac' /usr/bin/python3 -u _internal/tools/create_guide_screens.py
      - name: Validate screenshot dimensions, contrast and fresh content
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from PIL import Image, ImageStat
          from pathlib import Path
          folder = Path('_internal/docs/images')
          expected = {
              'main-light.png': (1180, 900),
              'main-dark.png': (1180, 900),
              'main-compact.png': (900, 640),
              'settings.png': (850, 780),
              'guide-recording.png': (820, 1300),
              'guide-gamebar.png': (820, 1340),
              'guide-speakers.png': (860, 780),
              'guide-merge.png': (1120, 900),
              'guide-setup.png': (860, 760),
              'guide-updates.png': (720, 550),
          }
          for name, dimensions in expected.items():
              file = folder / name
              assert file.is_file(), name
              with Image.open(file) as im:
                  assert im.size == dimensions, (name, im.size, dimensions)
                  s = ImageStat.Stat(im.convert('RGB'))
                  assert max(s.stddev) > 12, (name, s.stddev)
                  print(f'{name}: {im.size}, {file.stat().st_size} bytes, stddev={s.stddev}')
          with Image.open(folder/'main-light.png') as a, Image.open(folder/'main-dark.png') as b:
              assert a.convert('RGB').getpixel((40, 40)) != b.convert('RGB').getpixel((40, 40))
          PY
          git status --short -- _internal/docs/images
      - name: Commit only refreshed documentation PNG images to review branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- _internal/docs/images/*.png
          if git diff --cached --quiet; then
            echo 'No screenshot changes; refusing to claim a refresh' >&2
            exit 1
          fi
          git -c user.name=Ptcr8 -c user.email=182083273+Ptcr8@users.noreply.github.com commit -m 'Refresh current Tk UI documentation screenshots'
          git push origin HEAD:docs/refresh-readme-screens-20261109
