name: Prepare v1.0.4 reviewed release branch
on:
  push:
    branches: ['release/v1.0.4-20261112']
    paths: ['.github/workflows/prepare-v104.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'Ptcr8-tool/Unified_Transcriber_Windows' && github.ref == 'refs/heads/release/v1.0.4-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply bounded edits and remove this preparation workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/release/v1.0.4-20261112'
          git merge-base --is-ancestor 85891a4ba75624c80e64beef4729d01ac14469ca HEAD
          python3 - <<'PY'
          import ast
          from pathlib import Path
          def change(text, old, new):
              assert text.count(old) == 1, 'Unexpected source: '+old[:100]
              return text.replace(old, new, 1)
          path=Path('_internal/unified_gui.py')
          text=path.read_text(encoding='utf-8')
          text=change(text,'from app_hotkeys import WindowsHotkeys',
              'from app_hotkeys import WindowsHotkeys\nfrom workspace_cleanup import (begin_work as begin_workspace_work,\n    reset_preview as reset_workspace_preview, observe_event as observe_workspace_event,\n    clear_after_reopen as clear_closed_workspace)')
          text=change(text,'    def _begin_work(self):\n        self.stop_event.clear()',
              '    def _begin_work(self):\n        begin_workspace_work(self)\n        self.stop_event.clear()')
          text=change(text,"    def _reset_recognition_preview(self):\n        self.recognized_box.configure(state='normal')",
              "    def _reset_recognition_preview(self):\n        reset_workspace_preview(self)\n        self.recognized_box.configure(state='normal')")
          text=change(text,'                item=self.events.get_nowait()\n',
              '                item=self.events.get_nowait()\n                observe_workspace_event(self,item)\n')
          text=change(text,'        if self.config.tray_close and self.hide_to_tray():\n            return',
              '        if self.config.tray_close and self.hide_to_tray():\n            self._clear_completed_after_close=True\n            return')
          text=change(text,"        was_hidden = self.in_tray or self.root.state() in ('iconic','withdrawn')\n        self.in_tray=False",
              "        was_hidden = self.in_tray or self.root.state() in ('iconic','withdrawn')\n        if was_hidden:clear_closed_workspace(self)\n        self.in_tray=False")
          path.write_text(text,encoding='utf-8',newline='\n')
          path=Path('_internal/workspace_cleanup.py')
          text=path.read_text(encoding='utf-8')
          old='    # Also support successfully completed preexisting in-memory rows whose\n    # preview did not produce a transcript-saved event (e.g. external engines).\n    if rows and len(removed) == len(rows) and not state[\'warning\'] and not state[\'protected\']:\n        clear_preview = True\n'
          text=change(text,old,'    # A displayed snippet is not proof of a committed transcription.\n    # Keep unknown/unsaved previews even when older queue rows succeeded.\n    if pending_edits:\n        clear_preview = False\n')
          path.write_text(text,encoding='utf-8',newline='\n')
          assert Path('VERSION').read_text().strip()=='1.0.3'
          Path('VERSION').write_text('1.0.4\n',encoding='utf-8')
          path=Path('_internal/core.py')
          path.write_text(change(path.read_text(encoding='utf-8'),"APP_VERSION = '1.0.3'","APP_VERSION = '1.0.4'"),encoding='utf-8',newline='\n')
          notes='''# v1.0.4

          - **終了後の画面整理：** ×で通知領域へ閉じた後に再表示すると、正常完了した一覧項目と保存済み文字起こしのプレビューをクリアします。処理中・未完了・失敗・一部完了・中断の内容は保持します。単なる最小化ではクリアしません。録音・TXT・CSV・診断ログなどの保存済みファイルは削除しません。
          - **TOPの停止を2段階に：** 1回目は通常停止で保存・設定済みの文字起こし・変換を続行し、もう一度押すと全停止します。誤ダブルクリック防止のため切り替え直後0.6秒間は全停止を受け付けません。
          - **停止ショートカットの通知：** Windowsの無音通知で停止の受付を知らせます。保存完了とは区別し、作業中のウィンドウを前面へ移動しません。連打による同種通知を2秒間抑制します。Windows側の通知設定で表示されない場合があります。
          - **録音の初期入力：** 新規設定時はマイク＋PC再生音を選択します。保存済みの入力元設定は維持します。
          - **日本語・英語の表示：** インストーラーの最初とアプリの設定から選択できます。新規導入時はWindows表示言語を参照し、未対応言語は英語、取得失敗時は日本語を候補にします。音声認識の言語とは独立しています。一部の詳細な診断文などは日本語が残ります。
          - **ショートカットの事前確認：** キー入力時・保存前にWindowsへの登録可否を確認し、使用中や予約済みのキーを事前に表示します。登録後の競合検出も維持します。
          - **自動更新の安定化：** 更新EXEの転送期限を30分、アセット通信の待ち時間を45秒に拡大。取得量・進捗表示とキャンセルを改善し、SHA-256とビルド出所証明の検証は維持します。通信切断後の途中再開には未対応です。

          v1.0.3および検証版v1.0.3-a／v1.0.3-bから、同じインストール先を指定して更新できます。更新前に常駐も含めてアプリを完全終了し、重要な設定・録音・文字起こしをバックアップしてください。旧版の自動更新がタイムアウトする場合は新しいセットアップEXEで手動更新できます。

          **このEXEにはAuthenticodeの発行元署名がありません。** GitHubのビルド出所証明はWindowsの発行元署名とは異なります。端末の保護機能を無効にせず、組織の規定に従って使用してください。

          [操作ガイド](USAGE.md) · [検証範囲](VALIDATION.md) · [Code signing policy](https://github.com/Ptcr8-tool/Unified_Transcriber_Windows/blob/v1.0.4/CODE_SIGNING_POLICY.md)
          '''
          path=Path('_internal/docs/CHANGELOG.md')
          older=path.read_text(encoding='utf-8')
          assert older.startswith('# v1.0.3\n')
          older=older.replace('# v1.0.3\n','## v1.0.3\n',1).replace('\n# v1.0.2\n','\n## v1.0.2\n')
          path.write_text(notes.strip()+'\n\n'+older,encoding='utf-8',newline='\n')
          path=Path('README.md')
          text=path.read_text(encoding='utf-8')
          text=change(text,'# 文字起こし統合スタジオ v1.0.3（Windows）','# 文字起こし統合スタジオ v1.0.4（Windows）')
          text=change(text,'v1.0.3では、Hugging Faceのモデル取得、Windowsのキャッシュ動作、pyannote環境構築を修正し、文字起こし中の異常終了から復旧できる途中結果保存を追加しました。v1.0.2までのメニュー・出力設定の改善も含みます。',
              'v1.0.4では、正常終了後の画面整理、TOPの2段階停止、停止キーの無音通知、日本語／英語の表示選択、ショートカットの事前競合確認、自動更新のタイムアウト対策を追加しました。従来のモデル取得修正と途中結果保存も含みます。')
          text=text.replace('未署名のWindows版 v1.0.3','未署名のWindows版 v1.0.4').replace('Unified_Transcriber_Setup_v1.0.3.exe','Unified_Transcriber_Setup_v1.0.4.exe')
          text=text.replace('## 開発版の変更（配布v1.0.3には未反映）','## v1.0.4の操作改善')
          text=text.replace('## 画面プレビュー（v1.0.3）','## 画面プレビュー（v1.0.3の参考画像）')
          text=text.replace('現行のTk画面を**サンプルデータ**で再撮影しました。','下記はv1.0.3のTk画面を**サンプルデータ**で撮影した参考画像です。v1.0.4では停止表示・表示言語の設定などが一部変わっています。')
          marker='## 画面プレビュー（v1.0.3の参考画像）'
          paragraph='×で通知領域へ閉じてから再表示すると、正常完了した一覧項目と保存済みプレビューをクリアします。保存済みの録音・文字起こし・ログは削除せず、未完了・失敗・中断分は画面に残します。処理中の再表示や単なる最小化ではクリアしません。停止ショートカットは無音のWindows通知で受付を知らせます。インストーラーの最初と「設定・診断 → 操作・設定 → 表示言語」から日本語／英語を選択できます。\n\n'
          text=change(text,marker,paragraph+marker)
          path.write_text(text,encoding='utf-8',newline='\n')
          path=Path('_internal/docs/USAGE.md')
          text=path.read_text(encoding='utf-8').replace('（次回リリース向け）','（v1.0.4以降）')
          text=text.replace('配布済みv1.0.3／v1.0.3-aのEXEには含まれません。','正式版v1.0.4および検証版v1.0.3-b以降に含まれます。')
          text += '\n\n## ×で閉じた後の画面整理（v1.0.4以降）\n\n通知領域へ閉じる設定の場合、×で閉じてもプロセスは常駐します。再表示時に処理が終わっていれば、正常完了した一覧項目と保存済みプレビューだけをクリアします。処理中・未完了・失敗・一部完了・中断・スキップ・未保存プレビューは保持します。保存済みの録音・TXT・CSV・ログは削除しません。単なる最小化や表示中の再起動操作では整理しません。実際にアプリを終了した場合は、従来どおり次の起動は空の一覧です。\n\n## 表示言語と録音初期値（v1.0.4以降）\n\nインストーラーの最初と「設定・診断 → 操作・設定 → 表示言語」から日本語・英語を選択できます。既存の選択を優先し、新規導入時は端末の表示言語（未対応は英語、取得不能は日本語）を初期候補にします。音声認識言語は変更しません。新規録音の入力元はマイク＋PC再生音ですが、保存済みの入力設定は維持します。\n'
          path.write_text(text,encoding='utf-8',newline='\n')
          path=Path('_internal/docs/GUIDE.html')
          html=path.read_text(encoding='utf-8')
          addition='<section><h2>v1.0.4 の操作改善</h2><p>TOPは1回目が通常停止、もう一度押すと全停止です。通常停止では保存と設定済みの文字起こしを続けます。停止キーの操作は無音のWindows通知で受け付けたことを知らせます。</p><p>×で通知領域へ閉じてから再表示すると、正常完了した一覧項目と保存済みプレビューを整理します。未完了・失敗・中断分、処理中の画面は保持し、保存済みの録音・TXT・CSV・ログは削除しません。単なる最小化では整理しません。</p><p>インストーラーの最初と設定・診断の「表示言語」から日本語／英語を選択できます。音声認識の言語とは独立しています。録音の新規既定はマイク＋PC再生音です。掲載スクリーンショットはv1.0.3の参考画像で、一部表示が異なります。</p></section>\n'
          html=change(html,'</body>',addition+'</body>')
          path.write_text(html,encoding='utf-8',newline='\n')
          for file in Path('_internal').rglob('*.py'):
              ast.parse(file.read_text(encoding='utf-8-sig'),filename=str(file),feature_version=(3,11))
          Path('.github/workflows/prepare-v104.yml').unlink()
          PY
          git diff --check
          git add VERSION README.md _internal/core.py _internal/unified_gui.py _internal/workspace_cleanup.py _internal/docs/CHANGELOG.md _internal/docs/USAGE.md _internal/docs/GUIDE.html .github/workflows/prepare-v104.yml
          git -c user.name=Ptcr8 -c user.email=182083273+Ptcr8@users.noreply.github.com commit -m 'Prepare v1.0.4: clear successful UI results at X-close boundary; preserve files and unfinished work'
          git push origin HEAD:refs/heads/release/v1.0.4-20261112
